<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammad Faran Siddiqui | Portfolio</title>
<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#1a202c;
  --muted:#5a6578;
  --accent:#3b4cca;
  --accent-light:#eef0ff;
  --line:#3b4cca;
  --card-border:#3b4cca;
  --ok:#1f8a4c;
  --wip:#b7791f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  position:relative;
  overflow-x:hidden;
}

/* Ambient Canvas Background */
#quantum-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}

main{
  position: relative;
  z-index: 1;
  max-width:880px;
  margin:0 auto;
  padding:48px 20px 64px;
}

/* Enhanced Hero Header */
.header-block{
  display:flex;
  align-items:center;
  gap:28px;
  margin-bottom:36px;
  padding:28px;
  background:#ffffff;
  border:1.5px solid var(--accent);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(59,76,202,0.08);
  position:relative;
  overflow:hidden;
}

.header-block::before {
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 80% 20%, rgba(59,76,202,0.04) 0%, transparent 60%);
  pointer-events:none;
}

.profile-pic-wrapper {
  position:relative;
  flex-shrink:0;
}

.profile-pic-wrapper::after {
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:50%;
  border:2px dashed var(--accent);
  animation:rotate-ring 25s linear infinite;
  opacity:0.6;
}

@keyframes rotate-ring {
  to { transform: rotate(360deg); }
}

.profile-pic{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffffff;
  box-shadow:0 6px 16px rgba(59,76,202,0.18);
  display:block;
  background:#ffffff;
  position:relative;
  z-index:1;
}

.header-text{
  flex:1;
}

.eyebrow-container {
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:8px;
}

.eyebrow{
  font:600 12px/1 system-ui,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  background:var(--accent-light);
  padding:5px 12px;
  border-radius:999px;
}

.eyebrow-sub {
  font: 500 12px/1 system-ui,sans-serif;
  color: var(--muted);
}

h1{
  font-size:clamp(2.1rem, 5.5vw, 3rem);
  line-height:1.15;
  margin:4px 0 10px;
  font-family:Georgia, serif;
  color:#111827;
  letter-spacing:-0.02em;
}

.lead{
  color:var(--muted);
  font-size:1.12rem;
  margin:0;
  max-width:680px;
  line-height:1.6;
}

@media (max-width:580px){
  .header-block{
    flex-direction:column-reverse;
    align-items:flex-start;
    gap:20px;
    padding:20px;
  }
  .profile-pic{
    width:95px;
    height:95px;
  }
}

/* Grid Layout */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:20px;
}

@media (max-width:680px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* Base Card Style */
.card{
  background:#ffffff;
  border:1.5px solid var(--card-border);
  border-radius:16px;
  padding:22px;
  box-shadow:0 4px 14px rgba(59,76,202,0.05);
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  min-height:180px;
  transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(59,76,202,0.12);
}

h2{font:600 12px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
p{margin:0}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.row b{font-weight:600}
.muted{color:var(--muted)}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tags span{font:13px system-ui,sans-serif;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 12px;background:#ffffff;font-weight:500}

/* Full Width Card */
.full-width {
  grid-column: 1 / -1;
  margin-top: 20px;
}

.flashcards-wrapper {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 8px;
}

/* Flashcards */
.interactive-card {
  height: 165px;
  perspective: 1000px;
  cursor: pointer;
  outline: none;
  position: relative;
}

.inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.interactive-card:hover .inner {
  transform: translateY(-2px);
}

.interactive-card[aria-pressed="true"] .inner {
  transform: rotateY(180deg);
}

.interactive-card[aria-pressed="true"]:hover .inner {
  transform: rotateY(180deg) translateY(-2px);
}

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1.5px solid var(--accent);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #ffffff;
  box-shadow: 0 2px 8px rgba(59,76,202,0.06);
  overflow: hidden;
  transition: box-shadow 0.25s ease;
}

.interactive-card:hover .face {
  box-shadow: 0 6px 18px rgba(59,76,202,0.15);
}

.back {
  transform: rotateY(180deg);
  justify-content: flex-start;
}

.interactive-card:focus-visible .face {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.big-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 2px 0 0;
  letter-spacing: -0.01em;
}

.tap-hint {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: auto;
}

.lib {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 5px 0;
  border-bottom: 1px solid #e3e1d9;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.interactive-card[aria-pressed="true"] .lib {
  opacity: 1;
  transform: translateY(0);
}

.interactive-card[aria-pressed="true"] .lib:nth-child(2) { transition-delay: 0.1s; }
.interactive-card[aria-pressed="true"] .lib:nth-child(3) { transition-delay: 0.18s; }
.interactive-card[aria-pressed="true"] .lib:nth-child(4) { transition-delay: 0.26s; }

.lib:last-child { border-bottom: 0; }
.badge { font: 600 10px system-ui,sans-serif; border-radius: 999px; padding: 1px 7px; border: 1px solid currentColor; }
.ok { color: var(--ok); }
.wip { color: var(--wip); }

/* Dynamic Ripple Effect */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(59, 76, 202, 0.12);
  transform: scale(0);
  animation: ripple-anim 0.5s linear;
  pointer-events: none;
}

@keyframes ripple-anim {
  to {
    transform: scale(3.5);
    opacity: 0;
  }
}

.links a { color: var(--accent); text-decoration: none; word-break: break-all; font-weight: 600; }
